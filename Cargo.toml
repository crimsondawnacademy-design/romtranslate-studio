[workspace]
resolver = "2"
members = ["apps/cli", "apps/desktop/src-tauri", "crates/core"]

[workspace.package]
version = "0.1.8"
edition = "2021"
license = "MIT"
repository = "https://github.com/crimsondawnacademy-design/romtranslate-studio"

# Otimizacao de tamanho do binario (https://tauri.app/concept/size/)
# Depuracao so com as linhas (backtrace continua dizendo onde): com a
# depuracao inteira, target/debug passou de 40 GB em 14/10/2026 e encheu o
# disco do Mac — 36 binarios de teste, cada um com as dependencias inteiras.
[profile.dev]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
