[package]
name = "romtranslate-desktop"
description = "RomTranslate Studio — desktop shell (Tauri)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# Sufixo _lib evita conflito de nome com o binario no Windows.
name = "romtranslate_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
romtranslate-core = { path = "../../../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "1.1.6"
keyring = { version = "4.2.0", features = ["apple-native-keyring-store"] }
