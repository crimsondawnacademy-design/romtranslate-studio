[package]
name = "romtranslate-cli"
description = "RomTranslate Studio — CLI do core (o pipeline sem a janela)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "romtranslate"
path = "src/main.rs"

[dependencies]
romtranslate-core = { path = "../../crates/core" }
serde = "1"
serde_json = "1"
# Ja vem na arvore pelo Tauri, que acha a pasta de configuracao do app por ele.
dirs = "6"
clap = { version = "4.6.7", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt", "signal"] }
