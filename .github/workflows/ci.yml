name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      # Feedback rapido: so o core (sem deps de sistema). O crate desktop
      # compila no job "desktop" abaixo.
      - run: cargo clippy -p romtranslate-core --all-targets -- -D warnings
      - run: cargo test -p romtranslate-core

  # Compila e testa o app Tauri de verdade — pega quebra no crate desktop
  # que o job rust nao ve (deps de sistema do Tauri 2 em Linux, lista da
  # doc oficial: https://v2.tauri.app/start/prerequisites/).
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p romtranslate-desktop --all-targets -- -D warnings
      # O teste do keychain real e #[ignore] — nao roda em CI.
      - run: cargo test -p romtranslate-desktop

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm web:build
